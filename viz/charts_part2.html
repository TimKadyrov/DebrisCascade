
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
(function () {
  const D = JSON.parse(document.getElementById("chart-data").textContent);
  const C = { cyan: "#4da6ff", amber: "#ffcf5c", orange: "#ff8c42", red: "#ff5a52", green: "#39d98a", faint: "#647a99" };
  const nf = new Intl.NumberFormat("en-US");

  Chart.defaults.color = "#9fb2cc";
  Chart.defaults.borderColor = "rgba(90,140,200,.14)";
  Chart.defaults.font.family = "'IBM Plex Mono', monospace";
  Chart.defaults.font.size = 10;
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  Chart.defaults.plugins.legend.labels.boxHeight = 10;
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.maintainAspectRatio = false;
  Chart.defaults.animation = { duration: 500 };

  const line = (c, x, y, color, dash) => ({
    label: c, data: x.map((xv, i) => ({ x: xv, y: y[i] })), borderColor: color,
    backgroundColor: color, borderWidth: 2, borderDash: dash || [], pointRadius: 0, tension: .25,
  });
  const kM = v => v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "k" : v.toFixed(0);

  // 1. timeline, no launch
  const tl = D.timeline;
  new Chart(document.getElementById("c1"), {
    type: "line",
    data: { datasets: [
      line("box (well-mixed)", tl.years, tl.boxBaseline, C.cyan),
      line("conjunction (cube)", tl.years, tl.conjBaseline, C.green),
      line("box + barrel", tl.years, tl.boxBarrel, C.red, [5, 4]),
    ] },
    options: {
      scales: {
        x: { type: "linear", title: { display: true, text: "years" }, ticks: { maxTicksLimit: 6 } },
        y: { title: { display: true, text: "objects on orbit" }, ticks: { callback: kM } },
      },
      plugins: { legend: { position: "bottom" } },
    },
  });

  // 2. tipping
  const tp = D.tipping;
  new Chart(document.getElementById("c2"), {
    type: "line",
    data: { datasets: [
      { label: "50-yr growth", data: tp.rates.map((r, i) => ({ x: r, y: tp.growth[i] })),
        borderColor: C.amber, backgroundColor: C.amber, borderWidth: 2, pointRadius: 2, tension: .2 },
      { label: "runaway threshold (×1)", data: [{ x: tp.rates[0], y: 1 }, { x: tp.rates[tp.rates.length - 1], y: 1 }],
        borderColor: C.faint, borderWidth: 1, borderDash: [4, 4], pointRadius: 0 },
    ] },
    options: {
      scales: {
        x: { type: "linear", title: { display: true, text: "launches / yr into 900 km" } },
        y: { type: "logarithmic", title: { display: true, text: "50-yr growth ×" } },
      },
      plugins: { legend: { position: "bottom" } },
    },
  });

  // 3. responsive vs constant
  const rs = D.responsive;
  new Chart(document.getElementById("c3"), {
    type: "line",
    data: { datasets: [
      line("constant launch", rs.years, rs.constant, C.red),
      line("responsive launch", rs.years, rs.responsive, C.cyan),
      { label: "launch throttle", data: rs.years.map((yv, i) => ({ x: yv, y: rs.throttle[i] })),
        borderColor: C.amber, backgroundColor: C.amber, borderWidth: 1.5, borderDash: [3, 3], pointRadius: 0, yAxisID: "y2", tension: .2 },
    ] },
    options: {
      scales: {
        x: { type: "linear", title: { display: true, text: "years" }, ticks: { maxTicksLimit: 6 } },
        y: { title: { display: true, text: "objects" }, ticks: { callback: kM } },
        y2: { position: "right", min: 0, max: 1, title: { display: true, text: "throttle" },
          grid: { drawOnChartArea: false }, ticks: { callback: v => (v * 100).toFixed(0) + "%" } },
      },
      plugins: { legend: { position: "bottom" } },
    },
  });

  // 4. barrels
  const br = D.barrels;
  new Chart(document.getElementById("c4"), {
    type: "line",
    data: { datasets: [
      { label: "50-yr growth", data: br.counts.map((k, i) => ({ x: k, y: br.growth[i] })),
        borderColor: C.orange, backgroundColor: C.orange, borderWidth: 2, pointRadius: 2, tension: .2 },
      { label: "threshold (×1)", data: [{ x: br.counts[0], y: 1 }, { x: br.counts[br.counts.length - 1], y: 1 }],
        borderColor: C.faint, borderWidth: 1, borderDash: [4, 4], pointRadius: 0 },
    ] },
    options: {
      scales: {
        x: { type: "logarithmic", title: { display: true, text: "barrels (200k nails each)" } },
        y: { type: "logarithmic", title: { display: true, text: "50-yr growth ×" } },
      },
      plugins: { legend: { position: "bottom" } },
    },
  });

  // ---- findings ----
  const cross = (xs, ys, thr) => { // linear-interp x where y crosses thr (first upward)
    for (let i = 1; i < xs.length; i++) if (ys[i - 1] < thr && ys[i] >= thr) {
      const t = (thr - ys[i - 1]) / (ys[i] - ys[i - 1]); return xs[i - 1] + t * (xs[i] - xs[i - 1]);
    } return null;
  };
  const g = a => a[a.length - 1] / a[0];
  document.getElementById("f1").innerHTML =
    `Baseline drifts at the margin — box <b>${g(tl.boxBaseline).toFixed(2)}×</b>, conjunction <b>${g(tl.conjBaseline).toFixed(2)}×</b> over 50 yr, bracketing ×1. The +barrel line is <b>indistinguishable</b> from baseline.`;
  const rc = cross(tp.rates, tp.growth, 1);
  document.getElementById("f2").innerHTML =
    `Cross into runaway near <b>${rc ? Math.round(rc) : "~0"} launches/yr</b>; by 2000/yr the belt grows <b>${Math.round(tp.growth[tp.growth.length - 1])}×</b> in 50 years.`;
  document.getElementById("f3").innerHTML =
    `Constant launch → <b>${kM(rs.constant[rs.constant.length - 1])}</b> objects; responsive operators quit (throttle → 0%), capping it at <b>${kM(rs.responsive[rs.responsive.length - 1])}</b> — the band is abandoned, not filled.`;
  const bc = cross(br.counts, br.growth, 1.05);
  document.getElementById("f4").innerHTML =
    `~<b>${bc ? nf.format(Math.round(bc)) : "thousands of"} barrels</b> (${bc ? nf.format(Math.round(bc * D.meta.nailCount)) : ""} nails) to tip an already-marginal band — a logistically absurd launch campaign.`;

  document.getElementById("verdict").textContent =
    "\"It will do no harm\" is false — a barrel is a mission-kill weapon that lingers for decades at high altitude. \"It renders LEO unusable\" is also false — one barrel never triggers Kessler. The debris belt is already near-critical; launch and removal policy set its fate, and a barrel of nails is a rounding error against them.";
  document.getElementById("foot").textContent =
    `DebrisCascade · ${nf.format(D.meta.catalog)} catalog objects · barrel = ${nf.format(D.meta.nailCount)} nails @ ${D.meta.altKm} km`;
})();
</script>
